      # ==========================================
      # TENTAR EXPANDIR C: PARA 400 GB
      # ==========================================

      - name: Tentar expandir armazenamento para 400 GB
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " TENTANDO EXPANDIR C: PARA 400 GB"
          Write-Host "=========================================="

          $disk = Get-CimInstance Win32_LogicalDisk `
            -Filter "DeviceID='C:'"

          if ($null -eq $disk -or $null -eq $disk.Size) {
            Write-Host "ERRO: não foi possível identificar o disco C:."
            exit 1
          }

          $beforeGB = [math]::Round($disk.Size / 1GB, 2)

          Write-Host "Tamanho atual: $beforeGB GB"

          if ($beforeGB -ge 400) {
            Write-Host "OK: C: já possui pelo menos 400 GB."
          }
          else {
            Write-Host "Tentando localizar espaço expansível..."

            $partition = Get-Partition `
              -DriveLetter C `
              -ErrorAction SilentlyContinue

            if ($null -eq $partition) {
              Write-Host "ERRO: partição C: não encontrada."
              exit 1
            }

            $supported = Get-PartitionSupportedSize `
              -DriveLetter C `
              -ErrorAction SilentlyContinue

            if ($null -eq $supported) {
              Write-Host "ERRO: não foi possível determinar o tamanho máximo suportado."
              exit 1
            }

            $maxGB = [math]::Round($supported.SizeMax / 1GB, 2)

            Write-Host "Tamanho máximo suportado pela partição: $maxGB GB"

            $targetBytes = 400GB

            if ($supported.SizeMax -ge $targetBytes) {

              Write-Host "Espaço disponível para expansão."
              Write-Host "Expandindo C: para 400 GB..."

              Resize-Partition `
                -DriveLetter C `
                -Size $targetBytes `
                -ErrorAction Stop

              Start-Sleep -Seconds 5

              Write-Host "Expansão concluída."

            }
            else {
              Write-Host ""
              Write-Host "ERRO: o disco físico não possui espaço suficiente."
              Write-Host "Tamanho atual: $beforeGB GB"
              Write-Host "Máximo suportado: $maxGB GB"
              Write-Host "Necessário: 400 GB"
              Write-Host ""
              Write-Host "O runner precisa ser provisionado com armazenamento maior."
              exit 1
            }
          }

      # ==========================================
      # VERIFICAR WINDOWS / ARM64 / 400 GB
      # ==========================================

      - name: Verificar Windows ARM64 e armazenamento
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host " VERIFICANDO WINDOWS ARM64"
          Write-Host "=========================================="

          $os = Get-CimInstance Win32_OperatingSystem

          $version = Get-ItemProperty `
            "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion"

          $disk = Get-CimInstance Win32_LogicalDisk `
            -Filter "DeviceID='C:'"

          if ($null -eq $disk -or $null -eq $disk.Size) {
            Write-Host "ERRO: não foi possível identificar o disco C:."
            exit 1
          }

          $totalGB = [math]::Round($disk.Size / 1GB, 2)
          $freeGB = [math]::Round($disk.FreeSpace / 1GB, 2)

          Write-Host ""
          Write-Host "Sistema: $($os.Caption)"
          Write-Host "DisplayVersion: $($version.DisplayVersion)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Arquitetura: $env:PROCESSOR_ARCHITECTURE"
          Write-Host "Disco total: $totalGB GB"
          Write-Host "Espaço livre: $freeGB GB"
          Write-Host ""

          if ($os.Caption -notmatch "Windows 11") {
            Write-Host "ERRO: Windows 11 não detectado."
            exit 1
          }

          if ($env:PROCESSOR_ARCHITECTURE -ne "ARM64") {
            Write-Host "ERRO: o runner não está em ARM64."
            exit 1
          }

          if ($totalGB -lt 400) {
            Write-Host ""
            Write-Host "ERRO: armazenamento insuficiente."
            Write-Host "Necessário: pelo menos 400 GB."
            Write-Host "Encontrado: $totalGB GB."
            exit 1
          }

          Write-Host "OK: Windows 11 detectado."
          Write-Host "OK: ARM64 detectado."
          Write-Host "OK: armazenamento de pelo menos 400 GB."
